name: Release Cortex Brain Multi-Platform

on:
  workflow_dispatch:
  push:
    tags:
      - 'brain-v*'
      - 'v*'

jobs:
  build-cortex-brain:
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-24.04'
            target: 'x86_64-unknown-linux-gnu'
            args: '--features llama'
            artifact_name: 'cortex-brain-linux-deb'

          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--features llama'
            artifact_name: 'cortex-brain-windows-setup'

          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--features llama'
            artifact_name: 'cortex-brain-macos-arm64'

    runs-on: ${{ matrix.platform }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CMAKE_C_COMPILER_LAUNCHER: "sccache"
      CMAKE_CXX_COMPILER_LAUNCHER: "sccache"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.8

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          shared-key: "brain-${{ matrix.target }}"
          cache-all-crates: "true"
          save-if: ${{ always() }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install Frontend Dependencies & Build UI
        working-directory: apps/brain-ui
        run: |
          npm install
          npm run build

      - name: Install cargo-binstall
        uses: taiki-e/install-action@cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall --no-confirm tauri-cli

      - name: Build cortex-cli sidecar
        working-directory: rust
        run: cargo build --release -p cortex-cli --target ${{ matrix.target }}

      - name: Build Cortex Brain Bundle
        working-directory: rust/crates/cortex-brain-app
        run: cargo tauri build ${{ matrix.args }} --target ${{ matrix.target }}

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            rust/target/${{ matrix.target }}/release/bundle/deb/*.deb
            rust/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            rust/target/${{ matrix.target }}/release/bundle/msi/*.msi
            rust/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            rust/target/release/bundle/deb/*.deb
            rust/target/release/bundle/nsis/*.exe
            rust/target/release/bundle/dmg/*.dmg

  publish-release:
    name: Publish GitHub Release
    needs: [build-cortex-brain]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.deb
            release-artifacts/*.exe
            release-artifacts/*.msi
            release-artifacts/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
