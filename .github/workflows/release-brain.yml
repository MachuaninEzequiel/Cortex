name: Release Cortex Brain Multi-Platform

on:
  workflow_dispatch:
  push:
    tags:
      - 'brain-v*'
      - 'v*'

jobs:
  build-cortex-brain:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: '--features llama'
            artifact_name: 'cortex-brain-linux-deb'

          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--features llama'
            artifact_name: 'cortex-brain-windows-setup'

          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--features llama'
            artifact_name: 'cortex-brain-macos-arm64'

          - platform: 'macos-13'
            target: 'x86_64-apple-darwin'
            args: '--features llama'
            artifact_name: 'cortex-brain-macos-intel'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install Frontend Dependencies & Build UI
        run: |
          npm --prefix apps/brain-ui install
          npm --prefix apps/brain-ui run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Cortex Brain Bundle
        working-directory: rust/crates/cortex-brain-app
        run: cargo tauri build ${{ matrix.args }} --target ${{ matrix.target }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            rust/target/${{ matrix.target }}/release/bundle/deb/*.deb
            rust/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            rust/target/${{ matrix.target }}/release/bundle/msi/*.msi
            rust/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            rust/target/${{ matrix.target }}/release/bundle/macos/*.app
            rust/target/release/bundle/deb/*.deb
            rust/target/release/bundle/nsis/*.exe
            rust/target/release/bundle/dmg/*.dmg

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rust/target/${{ matrix.target }}/release/bundle/deb/*.deb
            rust/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            rust/target/${{ matrix.target }}/release/bundle/msi/*.msi
            rust/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            rust/target/release/bundle/deb/*.deb
            rust/target/release/bundle/nsis/*.exe
            rust/target/release/bundle/dmg/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
