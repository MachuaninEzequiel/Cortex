name: Cortex PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  cortex-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # required only for the optional PR-comment step
    steps:
      - uses: actions/checkout@v4
        with:
          # Required for diffing against the PR base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Cortex
        run: pip install cortex-memory

      # Level 1 — validation gate. Exit codes:
      #   0 = pass, 1 = warnings, 2 = blocked, 3 = error.
      - name: Cortex validate-pr
        id: cortex
        run: |
          cortex ci validate-pr \
            --base-commit "${{ github.event.pull_request.base.sha }}" \
            --head-commit "${{ github.event.pull_request.head.sha }}" \
            --base-branch "${{ github.event.pull_request.base.ref }}" \
            --head-branch "${{ github.event.pull_request.head.ref }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --pr-author "${{ github.event.pull_request.user.login }}" \
            --format json | tee /tmp/cortex-result.json

      # Level 2 — post / edit a sticky PR comment with the human-readable
      # summary. Runs even when the validation step failed so the
      # reviewer sees the blockers.
      - name: Post Cortex summary as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cortex ci validate-pr \
            --base-commit "${{ github.event.pull_request.base.sha }}" \
            --head-commit "${{ github.event.pull_request.head.sha }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --format pr-comment > /tmp/cortex-comment.md || true
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file /tmp/cortex-comment.md \
            --edit-last \
            || gh pr comment "${{ github.event.pull_request.number }}" \
                 --body-file /tmp/cortex-comment.md
