[package]
name = "cortex-brain"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Asistente local nativo de Cortex (Obra 06 BRAIN-2/3 en Rust)."

[[bin]]
name = "cortex-brain"
path = "src/main.rs"

[dependencies]
regex = "1"
serde_json = "1"
encoding_rs = "0.8"
cortex-branding = { path = "../cortex-branding" }
# C-L1.2: cliente HTTP sync para descarga del GGUF. Spec: doc 19 §2.
ureq = { workspace = true }

# BRAIN-2: backend llama.cpp/GGUF (feature opcional: compila llama.cpp vía cmake;
# sólo se activa con --features llama para no penalizar builds que no lo usan).
[dependencies.llama-cpp-2]
version = "0.1.154"
optional = true

[features]
llama = ["dep:llama-cpp-2"]

[dev-dependencies]
# sin dependencias: los tests usan CORTEX_BIN=/bin/echo o un stub
