[workspace]
resolver = "2"
members = [
    "crates/cortex-core",
    "crates/cortex-embed",
    "crates/cortex-py",
    "crates/cortex-brain",
    "crates/cortex-cli",
    # Obra 07 (migración total): docs/transformacion/08-MIGRACION-TOTAL-RUST.md
    "crates/cortex-config",
    "crates/cortex-app",
    # Obra 07 P10 (branding + TUI): docs/transformacion/10-P10-BRANDING-TUI.md
    "crates/cortex-branding",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
unicode-normalization = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# Reglas del workspace (HANDOFF §TAREA-RUST R2 / docs/transformacion/03 §6.2):
# - cortex-core: dominio PURO. Jamás depende de pyo3. Testeable offline.
# - cortex-embed: wrapper de inferencia ONNX (ort). dim SIEMPRE paramétrica.
# - cortex-py: fachada PyO3 GRUESA (APIs batch, nunca loop-per-item).
#   El feature `extension-module` NO es default para que `cargo test` linkee
#   contra libpython; maturin lo activa automáticamente al compilar el wheel.

[profile.release]
lto = "thin"
codegen-units = 1
