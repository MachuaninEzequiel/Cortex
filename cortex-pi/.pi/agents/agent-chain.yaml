# Cortex Agent Chain — Pipeline secuencial (FALLBACK)
#
# ⚠️ Release 2.5 + cortex-net: este archivo es FALLBACK para IDEs que no
# soportan subagents nativos (ej: Codex single-agent) o cuando cortex-net
# no está disponible (sin Pi extensions cargadas).
#
# Si tu IDE soporta cortex-net (Pi con cortex-net.ts cargado), NO uses
# estos pipelines — usá el team `cortex-sddwork` directamente. La red
# coordina lo que estos chains hacían secuencialmente, pero mejor.
#
# Cambios respecto a 2.5 pre-net:
#   - Eliminado: validate_handoff / expected_input_agent / YAML AgentHandoff.
#     El contrato es el Cortex Session + checkpoints, no YAML.
#   - Cada step ahora termina con un cortex_session_checkpoint, no con YAML.
#   - El chain solo tiene sentido cuando la red está apagada.

chains:
  # Pipeline SDDwork completo (fallback secuencial sin red)
  sddwork:
    description: "Ciclo completo SDDwork — modo fallback secuencial sin cortex-net"
    steps:
      - agent: cortex-sync
        prompt: |
          Analizá la siguiente tarea y generá un SPEC completo:
          TAREA: $INPUT

          ⚠️ MANDATORY: ejecutá cortex_sync_ticket PRIMERO antes de cortex_create_spec.
          Si existe CONTEXT.md en el workspace, leelo antes de redactar la spec.
          Finalizá con la spec persistida en vault/specs/<fecha>-<slug>.md
          y el mensaje canónico de cortex-sync.

      - agent: cortex-SDDwork
        prompt: |
          Implementá según la SPEC recién creada usando Intelligent Routing:
          $INPUT

          Evaluá complejidad y elegí:
          - 🟢 FAST TRACK (1-2 archivos): implementá directamente.
          - 🔴 DEEP TRACK (complejo): delegá a explorer → designer → implementer
            secuencialmente (estás en modo sin red).

          Emití cortex_session_checkpoint al final con source="cortex-SDDwork".
          Pasá al security auditor.

      - agent: cortex-security-auditor
        prompt: |
          Realizá una auditoría de seguridad del código implementado:
          $INPUT

          Buscá vulnerabilidades, secretos y cumplimiento de estándares OWASP.
          Veredicto: APROBADO o BLOQUEADO.
          Emití cortex_session_checkpoint con source="cortex-security-auditor".
          Pasá al test-verifier.

      - agent: cortex-test-verifier
        prompt: |
          Verificá calidad y cobertura de los cambios:
          $INPUT

          Ejecutá tests y validá cobertura >85%.
          Veredicto: APROBADO o BLOQUEADO.
          Emití cortex_session_checkpoint con source="cortex-test-verifier".
          Pasá al documenter.

      - agent: cortex-documenter
        prompt: |
          Persistí el conocimiento de esta sesión:
          $INPUT

          Ejecutá el pipeline canónico: cortex_ping, cortex_documenter_briefing,
          analizá briefing, decidí qué notas emitir, escribí con criterio,
          cortex_self_review_note (opcional), cortex_write_doc por cada nota,
          cortex_close_session.

          Si la sesión va a `handoff`, llená blockers y next_steps.

  # Hotfix Fast Track (sin red, 1 archivo, sin subagents)
  hotfix:
    description: "Fix rápido con Fast Track directo (sin red)"
    steps:
      - agent: cortex-sync
        prompt: |
          Analizá el hotfix y generá una spec minimalista:
          $INPUT
          ⚠️ MANDATORY: cortex_sync_ticket PRIMERO.

      - agent: cortex-SDDwork
        prompt: |
          Implementá el hotfix en modo FAST TRACK:
          $INPUT
          Sin Deep Track. Implementá directamente.
          Emití un checkpoint al final.

      - agent: cortex-documenter
        prompt: |
          Documentá el hotfix:
          $INPUT
          Pipeline canónico. Tag la session note como "hotfix".

  # Refactor con análisis histórico (sin red)
  refactor:
    description: "Refactoring con contexto histórico — modo fallback"
    steps:
      - agent: cortex-sync
        prompt: |
          Analizá el código a refactorizar y recuperá contexto histórico:
          $INPUT
          ⚠️ MANDATORY: cortex_sync_ticket PRIMERO.
          Identificá qué decisiones motivaron el diseño actual.

      - agent: cortex-code-explorer
        prompt: |
          Analizá la arquitectura actual:
          $INPUT
          Mapeá dependencias y patrones existentes.
          Output conciso. Emití checkpoint con source="cortex-code-explorer".

      - agent: cortex-code-implementer
        prompt: |
          Ejecutá el refactor según el contexto:
          $INPUT
          Mantené o mejorá la cobertura de tests.
          Emití checkpoint con source="cortex-code-implementer".

      - agent: cortex-documenter
        prompt: |
          Documentá las decisiones del refactor:
          $INPUT
          Si la decisión amerita ADR (3 criterios), creálo.
