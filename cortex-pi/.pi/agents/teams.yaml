# Cortex Agent Team Definitions — Release 2.5 + cortex-net
#
# Los teams ya NO son pipelines de ejecución (eso lo hace cortex-net en
# paralelo). Son simplemente listas de personas que el system-select muestra
# como disponibles para activar en un workspace.
#
# El cambio de Release 2.5+net respecto a versiones previas:
#
#   - cortex-sddwork team: incluye TODOS los agentes EXCEPTO sync
#     (sync se invoca aparte, secuencialmente antes de entrar a la red).
#     SDDwork es el orquestador dentro de la red.
#
#   - cortex-hotfix team: pipeline simple Fast Track sin red activa
#     (1 archivo, 1 agente, sin coordinación).
#
#   - cortex-byo team: para usar con BYO mode (Bring Your Own agent).
#     El usuario corre cortex-sync, después su propio agente, después
#     /cortex-documenter para cerrar.
#
#   - cortex-audit team: auditoría de un repo existente, solo lectura.

cortex-sddwork:
  # Full pipeline. Sync se ejecuta PRIMERO afuera de la red (B' design).
  # Los demás viven en cortex-net mientras la sesión está abierta.
  - cortex-sync
  - cortex-SDDwork
  - cortex-code-designer
  - cortex-code-explorer
  - cortex-code-implementer
  - cortex-security-auditor
  - cortex-test-verifier
  - cortex-documenter

cortex-hotfix:
  # Fast Track: SDDwork solo, sin red, sin subagents.
  # Para fixes urgentes de 1-2 archivos.
  - cortex-sync
  - cortex-SDDwork
  - cortex-documenter

cortex-byo:
  # Bring Your Own: sync abre la sesión, vos trabajás con cualquier agente,
  # documenter cierra. No hay middle predefinido — vos sos el middle.
  - cortex-sync
  - cortex-documenter

cortex-audit:
  # Solo análisis (sin implementación). Útil para auditorías de repos
  # existentes o para entender un codebase nuevo.
  - cortex-sync
  - cortex-code-explorer
  - cortex-security-auditor
  - cortex-documenter
